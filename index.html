<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#65182f"><title>Weinabend – Blind Tasting</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f0eb;color:#251d20}main{max-width:560px;margin:18vh auto;padding:24px;text-align:center}h1{font-size:1.45rem}p{color:#786d70}.dot{display:inline-block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><main><h1>🍷 Weinabend wird geladen</h1><p>Blind Tasting · Axel · Olli · Nadine · Anja</p><p class="dot">● ● ●</p></main><script>(async()=>{try{const r=await fetch('https://ttympdkjbtuspmroasae.supabase.co/functions/v1/wine-night-gh?event=BURGUND',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const scripts=[...doc.querySelectorAll('script')].map(s=>({src:s.src,text:s.textContent,type:s.type||''}));doc.querySelectorAll('script').forEach(s=>s.remove());document.head.innerHTML=doc.head.innerHTML;document.body.innerHTML=doc.body.innerHTML;for(const x of scripts){const s=document.createElement('script');if(x.type)s.type=x.type;if(x.src){s.src=x.src;s.async=false;await new Promise((ok,bad)=>{s.onload=ok;s.onerror=bad;document.body.appendChild(s)})}else{s.textContent=x.text;document.body.appendChild(s)}}}catch(e){document.body.innerHTML='<main><h1>App konnte nicht geladen werden</h1><p>'+String(e)+'</p></main>'}})();</script></body></html>
