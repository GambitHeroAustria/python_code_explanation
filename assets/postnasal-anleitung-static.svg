<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1190" role="img" aria-labelledby="pns-title pns-desc">
  <title id="pns-title">Schrittgrafik: Postnasale Geschmacksexplosion</title>
  <desc id="pns-desc">Statische Anleitung in fünf Schritten: Erstens die Nase sanft mit zwei Fingern zuhalten. Zweitens mit geschlossener Nase einen kleinen Schluck nehmen. Drittens schlucken und das Glas kurz absetzen. Viertens die Nase öffnen und ruhig durch die Nase ausatmen. Fünftens erneut am Glas riechen und den Unterschied vergleichen.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>
  <rect width="720" height="1190" fill="#fdf8f2"/>
  <text x="34" y="52" font-size="17" font-weight="800" letter-spacing="1.6" fill="#65182f">POSTNASALE GESCHMACKSEXPLOSION · SO GEHT'S</text>
  <defs>
    <g id="pns-face">
      <path d="M59 42 Q33 48 29 79 Q26 106 42 124 Q52 135 50 148 L75 148 Q98 146 105 129 Q109 120 107 111 L118 107 Q122 105 119 101 L108 88 Q108 59 89 47 Q75 39 59 42 Z" fill="#f7e9df" stroke="#451020" stroke-width="3.4" stroke-linejoin="round"/>
      <circle cx="80" cy="76" r="3.6" fill="#451020"/>
      <path d="M98 125 q7 2 13 0" stroke="#451020" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g id="pns-fingers">
      <rect x="98" y="80" width="33" height="12" rx="6" fill="#f1d9c8" stroke="#451020" stroke-width="3"/>
      <rect x="102" y="94" width="29" height="12" rx="6" fill="#f1d9c8" stroke="#451020" stroke-width="3"/>
    </g>
    <g id="pns-glass">
      <path d="M0 0 Q1 28 22 36 L22 65 Q10 68 7 74 L59 74 Q56 68 44 65 L44 36 Q65 28 66 0 Z" fill="none" stroke="#451020" stroke-width="3" stroke-linejoin="round"/>
      <path d="M4 7 Q6 25 24 32 L42 32 Q60 25 62 7 Z" fill="#7d2944"/>
    </g>
    <g id="pns-card">
      <rect width="652" height="196" rx="18" fill="#ffffff" stroke="#eadfd9" stroke-width="2"/>
      <rect width="176" height="196" rx="18" fill="#faf3ec"/>
    </g>
  </defs>

  <g transform="translate(34,84)">
    <use href="#pns-card"/>
    <g transform="translate(18,22)"><use href="#pns-face"/><use href="#pns-fingers"/></g>
    <circle cx="216" cy="44" r="19" fill="#65182f"/><text x="216" y="51" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="248" y="52" font-size="23" font-weight="800" fill="#451020">Nase sanft zuhalten</text>
    <text x="248" y="86" font-size="17" fill="#55484a">Mit zwei Fingern die Nase schließen.</text>
    <text x="248" y="112" font-size="17" fill="#55484a">Sie bleibt in den nächsten Schritten zu.</text>
  </g>

  <g transform="translate(34,300)">
    <use href="#pns-card"/>
    <g transform="translate(18,22)"><use href="#pns-face"/><use href="#pns-fingers"/></g>
    <g transform="translate(104,96) rotate(-38)"><use href="#pns-glass"/></g>
    <circle cx="216" cy="44" r="19" fill="#65182f"/><text x="216" y="51" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="248" y="52" font-size="23" font-weight="800" fill="#451020">Kleinen Schluck nehmen</text>
    <text x="248" y="86" font-size="17" fill="#55484a">Nase bleibt geschlossen –</text>
    <text x="248" y="112" font-size="17" fill="#55484a">nur ein kleiner Schluck.</text>
  </g>

  <g transform="translate(34,516)">
    <use href="#pns-card"/>
    <g transform="translate(18,22)"><use href="#pns-face"/><use href="#pns-fingers"/></g>
    <path d="M116 152 q5 11 1 22" stroke="#65182f" stroke-width="3.4" fill="none" stroke-linecap="round" transform="translate(2,-4)"/>
    <path d="M112 168 l6 8 7 -6" stroke="#65182f" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(96,96)"><use href="#pns-glass"/></g>
    <path d="M98 174 h62" stroke="#b7a08e" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="216" cy="44" r="19" fill="#65182f"/><text x="216" y="51" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="248" y="52" font-size="23" font-weight="800" fill="#451020">Schlucken, Glas absetzen</text>
    <text x="248" y="86" font-size="17" fill="#55484a">Den Wein schlucken und das Glas</text>
    <text x="248" y="112" font-size="17" fill="#55484a">kurz abstellen. Nase noch zu.</text>
  </g>

  <g transform="translate(34,732)">
    <use href="#pns-card"/>
    <g transform="translate(18,22)"><use href="#pns-face"/></g>
    <path d="M138 126 q23 5 39 22" stroke="#466d8c" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M136 137 q17 11 24 29" stroke="#466d8c" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M172 144 l8 7 -2 -11" stroke="#466d8c" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="216" cy="44" r="19" fill="#65182f"/><text x="216" y="51" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <text x="248" y="52" font-size="23" font-weight="800" fill="#451020">Nase öffnen, ruhig ausatmen</text>
    <text x="248" y="86" font-size="17" fill="#55484a">Durch die Nase ausatmen – der</text>
    <text x="248" y="112" font-size="17" fill="#55484a">Aromaschub steigt über den Rachen auf.</text>
  </g>

  <g transform="translate(34,948)">
    <use href="#pns-card"/>
    <g transform="translate(18,22)"><use href="#pns-face"/></g>
    <g transform="translate(120,98) scale(0.72)"><use href="#pns-glass"/></g>
    <path d="M132 92 q5 -9 0 -17 M143 96 q6 -10 1 -20" stroke="#9b731d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="216" cy="44" r="19" fill="#65182f"/><text x="216" y="51" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
    <text x="248" y="52" font-size="23" font-weight="800" fill="#451020">Erneut riechen, vergleichen</text>
    <text x="248" y="86" font-size="17" fill="#55484a">Nochmals am Glas riechen: Wie stark</text>
    <text x="248" y="112" font-size="17" fill="#55484a">ist der Unterschied? Das ist deine 1–5-Wertung.</text>
  </g>
</svg>
