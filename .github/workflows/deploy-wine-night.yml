name: Validate Wine Night App

# Der frühere Sync-Job hat index.html aus einer Supabase Edge Function ins Repo
# kopiert (Deployment -> Repo). Das Repo ist jetzt die kanonische Quelle; dieser
# Workflow validiert nur noch, dass der Dateisatz vollständig und autonom ist.
on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate file set
        run: bash scripts/validate.sh
