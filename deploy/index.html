function requiredFields(){
  if(st.tasting_type==='red_simple')return['nose_intensity','aromas','oak','body','tannin','acidity','finish'];
  return st.tasting_type==='white'?['nose_intensity','swirl_open','aromas','acidity','body','texture','oak','mineral','retronasal','finish']:['nose_intensity','swirl_open','aromas','acidity','tannin','body','texture','retronasal','finish'];
}
function filledCount(gl){const a=ans[gl];return requiredFields().reduce((n,k)=>{if(k==='aromas'){const ok=st.tasting_type==='red_simple'?a.aromas.length>=2&&a.aromas.length<=4:a.aromas.length>0;return n+(ok?1:0)}return n+(a[k]!==null&&a[k]!==undefined&&a[k]!==''?1:0)},0)}
function complete(gl){return filledCount(gl)===requiredFields().length}
function saveLabel(gl){const c=saveCtl[gl];if(c.error)return'Fehler';if(c.inFlight||c.pending)return'speichert…';return'gespeichert'}
function taste(){
  const both=complete(1)&&complete(2),total=requiredFields().length;
  A.innerHTML=brand(`<span class="room">${e(st.theme||R)}</span>`)+`<div class="toprow">${backLink()}<span class="savehint">Änderbar bis zur Profilfreigabe</span></div><div class="tabs"><button class="tab ${g===1?'on':''}" data-glass="1"><span>Wein 1</span><small>${filledCount(1)}/${total}${complete(1)?' ✓':''}</small></button><button class="tab ${g===2?'on':''}" data-glass="2"><span>Wein 2</span><small>${filledCount(2)}/${total}${complete(2)?' ✓':''}</small></button></div><section class="card tasting"><div class="pairtop"><div><div class="ey">${st.tasting_type==='white'?'🥂 Weißwein':st.tasting_type==='red_simple'?'⚡ Rotwein · kurz':'🍷 Rotwein'} · Wein ${g}</div><h2>Dein Eindruck</h2></div><span id="savestate" class="pill ${saveCtl[g].error?'warn':(!saveCtl[g].inFlight&&!saveCtl[g].pending?'done':'')}">${saveLabel(g)}</span></div><p class="muted small">Zwischen den Tabs wechseln, vergleichen und alles jederzeit korrigieren.</p>${fullForm()}</section><section class="card compact ${both?'ready':''}"><b>${both?'✓ Beide Bögen vollständig':'Noch nicht vollständig'}</b><p class="muted small">${both?'Alles ist gespeichert. Änderungen bleiben bis zur Freigabe möglich.':'Du musst nicht in einer festen Reihenfolge arbeiten.'}</p>${E?`<a class="btn secondary full center" href="${portalLink()}" data-nav="${portalLink()}">Zur Themenauswahl</a>`:''}</section>`;
  document.querySelectorAll('[data-glass]').forEach(z=>z.onclick=()=>{g=+z.dataset.glass;taste()});
  document.querySelectorAll('[data-k]').forEach(z=>z.onclick=()=>{ans[g][z.dataset.k]=+z.dataset.v;queueSave(g);taste()});
  document.querySelectorAll('[data-a]').forEach(z=>z.onclick=()=>{const v=z.dataset.a,a=ans[g].aromas,max=st.tasting_type==='red_simple'?4:3;a.includes(v)?ans[g].aromas=a.filter(x=>x!==v):a.length<max?ans[g].aromas=[...a,v]:toast(`Maximal ${max} Aromarichtungen`);queueSave(g);taste()});
  document.querySelectorAll('[data-x]').forEach(z=>z.onclick=()=>{ans[g].texture=z.dataset.x;queueSave(g);taste()});
  document.querySelectorAll('[data-range]').forEach(z=>{z.oninput=()=>{const b=document.getElementById('sv_'+z.dataset.range);if(b)b.textContent=z.value+'/5';z.classList.remove('unset')};z.onchange=()=>{ans[g][z.dataset.range]=+z.value;queueSave(g);taste()}});
  const no=document.getElementById('note');if(no)no.oninput=x=>{ans[g].note=x.target.value;queueSave(g,650)};
}
function updateSaveDom(gl){if(g!==gl)return;const z=document.getElementById('savestate');if(!z)return;z.textContent=saveLabel(gl);z.className=`pill ${saveCtl[gl].error?'warn':(!saveCtl[gl].inFlight&&!saveCtl[gl].pending?'done':'')}`}
function queueSave(gl,delay=300){const c=saveCtl[gl];ans[gl].client_revision=(Number(ans[gl].client_revision)||0)+1;clearTimeout(c.timer);c.pending=true;c.error=false;c.timer=setTimeout(()=>drainSave(gl),delay);updateSaveDom(gl)}
async function drainSave(gl){
  const c=saveCtl[gl];clearTimeout(c.timer);c.timer=null;
  if(c.inFlight)return c.promise;
  if(!c.pending)return;
  c.pending=false;c.inFlight=true;c.error=false;updateSaveDom(gl);
  const S=getSession(R),payload=JSON.parse(JSON.stringify(ans[gl]));
  c.promise=rpcCompat('save_tasting_v2','save_tasting',{p_code:R,p_token:S.token,p_glass_no:gl,p_payload:payload})
    .then(d=>{if(typeof d?.complete==='boolean')ans[gl].is_complete=d.complete;if(d?.client_revision!=null)ans[gl].client_revision=Math.max(Number(ans[gl].client_revision)||0,Number(d.client_revision)||0)})
    .catch(x=>{c.error=true;toast(x.message)})
    .finally(()=>{c.inFlight=false;c.promise=null;updateSaveDom(gl);if(c.pending)drainSave(gl)});
  return c.promise;
}
async function flushAll(){for(const gl of [1,2]){const c=saveCtl[gl];if(c.timer){clearTimeout(c.timer);c.timer=null}if(c.pending)await drainSave(gl);if(c.inFlight&&c.promise)await c.promise;if(c.pending)await drainSave(gl)}}
function keepaliveSave(gl){const c=saveCtl[gl],S=getSession(R);if(!R||!S||!c.pending||c.inFlight)return;const body=JSON.stringify({p_code:R,p_token:S.token,p_glass_no:gl,p_payload:ans[gl]});try{fetch(`${U}/rest/v1/rpc/save_tasting`,{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body,keepalive:true})}catch{}}

function personalBreakdown(me){const b=me.breakdown;if(b){const av=(Number(b.aromatik??b.nose)||0)+(b.aromatik!=null?0:(Number(b.aromas)||0)),am=(Number(b.aromatik_max??b.nose_max)||0)+(b.aromatik_max!=null?0:(Number(b.aromas_max)||0));const sv=Number(b.struktur??b.structure)||0,sm=Number(b.struktur_max??b.structure_max)||0;const fv=Number(b.abgang??b.finish)||0,fm=Number(b.abgang_max??b.finish_max)||0;const zv=Number(b.zuordnung??b.assignment)||0,zm=Number(b.zuordnung_max??b.assignment_max)||0;return`<div class="scorebreak four"><div>${scoreBar('Aromatik',av,am)}</div><div>${scoreBar('Struktur',sv,sm)}</div><div>${scoreBar('Abgang',fv,fm)}</div><div>${scoreBar('Zuordnung',zv,zm)}</div></div>`}const total=Number(me.score)||0,profile=me.profile_correct?8:0,sens=Math.max(0,total-profile);return`<div class="scorebreak"><div>${scoreBar('Sensorik',sens,38)}</div><div>${scoreBar('Profilzuordnung',profile,8)}</div></div>`}

function scoreBar(label,value,max){const pct=max?Math.max(0,Math.min(100,value/max*100)):0;return`<div class="barlabel"><span>${e(label)}</span><b>${fmt(value)}/${fmt(max)}</b></div><div class="bar"><i style="width:${pct}%"></i></div>`}

  return`<section class="card"><h3>Was die Gruppe wahrgenommen hat</h3><p class="muted small">Die häufigsten angekreuzten Aromagruppen – keine objektive Wahrheitsliste.</p><div class="groupgrid"><div class="groupwine"><div class="ey">Wein 1</div><div class="tags">${aroma(1)}</div></div><div class="groupwine"><div class="ey">Wein 2</div><div class="tags">${aroma(2)}</div></div></div>${glassAverages(r)}<div class="divider"></div>${voteBar('Lieblingswein',fav)}${voteBar('Vermutlich teurer',price)}<p class="small muted centertext">${correct}/${total} ordneten Profil A korrekt zu.</p></section>`;
}
function votes(lb,key){return{one:(lb||[]).filter(x=>x[key]===1).length,two:(lb||[]).filter(x=>x[key]===2).length,total:(lb||[]).filter(x=>x[key]===1||x[key]===2).length}}
function voteBar(label,v){const p1=v.total?Math.round(v.one/v.total*100):0,p2=v.total?100-p1:0;return`<div class="voteblock"><div class="barlabel"><span>${e(label)}</span><b>${v.total} Stimmen</b></div><div class="splitbar"><i style="width:${p1}%">${p1?p1+'%':''}</i><em style="width:${p2}%">${p2?p2+'%':''}</em></div><div class="splitlabels"><span>Wein 1</span><span>Wein 2</span></div></div>`}
function glassAverages(r){
  if(!Array.isArray(r.glass_stats)||r.glass_stats.length<2)return'';
  const one=r.glass_stats.find(x=>x.glass===1)||{},two=r.glass_stats.find(x=>x.glass===2)||{};
  const a1=one.averages||one,a2=two.averages||two;
  const simple=r.tasting_type==='red_simple';
  const fields=simple?[['nose_intensity','Duft/Frucht'],['oak','Würze/Röstung'],['body','Körper'],['tannin','Tannin'],['acidity','Frische'],['finish','Abgang']]:r.tasting_type==='white'?[['acidity','Säure'],['body','Körper'],['oak','Holz/Röstung'],['mineral','Stein/Kreide'],['finish','Abgang']]:[['acidity','Säure'],['tannin','Tannin'],['body','Körper'],['finish','Abgang']];
  const max=simple?5:3;
  return`<div class="divider"></div><div class="ttl">Gruppenmittelwerte</div><p class="tiny muted">Skala 1–${max}; dient nur als kompakte Zusammenfassung.</p><div class="avgtable">${fields.map(([k,l])=>avgRow(l,a1[k],a2[k],max)).join('')}</div>`;
}
function avgRow(label,a,b,max=3){const av=Number(a)||0,bv=Number(b)||0;return`<div class="avgrow"><b>${e(label)}</b><span><i style="width:${av/max*100}%"></i><em>1 · ${av?av.toFixed(1):'–'}</em></span><span><i style="width:${bv/max*100}%"></i><em>2 · ${bv?bv.toFixed(1):'–'}</em></span></div>`}

async function loadEventLeaderboard(eventState){
  if(E){
    try{
      const shared=await rpc('get_event_leaderboard',{p_event_code:E});
      if(shared?.people?.length)return shared;
    }catch{}
  }
  return loadEventHistory(eventState);
}
async function loadEventHistory(eventState){
  const out=[];
  for(const room of eventState?.rooms||[]){
    if(room.phase!=='revealed')continue;
    let snap=null;
    const S=getSession(room.code);
    if(S?.token){
      try{
        const r=await rpcCompat('get_reveal_v2','get_reveal',{p_code:room.code,p_token:S.token});
        cacheReveal(room.code,r,room.theme);
        snap=cachedReveal(room.code);
      }catch{snap=cachedReveal(room.code)}
    }else snap=cachedReveal(room.code);
    if(snap){
      snap.theme=room.theme||snap.theme;
      snap.sort_order=room.sort_order||out.length;
      out.push(snap);
    }
  }
  return out;
}
function aggregateHistory(history){
  const rooms=history.filter(Boolean),names=new Map();
  rooms.forEach(r=>(r.leaderboard||[]).forEach(x=>{const k=String(x.name).trim().toLowerCase();if(!names.has(k))names.set(k,{name:x.name})}));
  const people=[];
  for(const [key,base] of names){let cum=0,played=0;const timeline=rooms.map(r=>{const x=(r.leaderboard||[]).find(y=>String(y.name).trim().toLowerCase()===key),score=x?Number(x.score)||0:0;if(x)played++;cum+=score;return{theme:r.theme,score,cumulative:cum,played:!!x}});people.push({name:base.name,total:cum,max:rooms.length*46,played,timeline,average:played?cum/(played*46)*100:0})}
  people.sort((a,b)=>b.total-a.total||b.average-a.average||a.name.localeCompare(b.name));return{rooms,people,shared:false};
}
function normalizeEventLeaderboard(input){
  if(input?.people&&input?.rooms){return{shared:true,rooms:input.rooms,people:input.people.map(p=>({name:p.name,total:Number(p.total_score)||0,max:Number(p.max_score)||0,played:Number(p.rounds_played)||0,average:Number(p.average_pct)||0,timeline:(p.timeline||[]).map(t=>({theme:t.theme,score:Number(t.score)||0,cumulative:Number(t.cumulative)||0,played:!!t.played}))}))}}
  return aggregateHistory(input||[]);
}
function eventLeaderboard(input,title){
  const d=normalizeEventLeaderboard(input);if(!d.rooms.length||!d.people.length)return'';
  return`<section class="card timelinecard"><div class="pairtop"><div><div class="ey">Gesamtwertung</div><h3>${e(title)}</h3></div><span class="pill done">${d.rooms.length} ${d.rooms.length===1?'Runde':'Runden'}</span></div><p class="muted small">${d.shared?'Zentral gespeicherte kumulative Punkte aller aufgelösten Paare.':'Kumulative Punkte der auf diesem Gerät verfügbaren, bereits aufgelösten Paare.'}</p>${timelineChart(d)}<div class="timelineRanks">${d.people.map((p,i)=>`<div class="rank"><div class="n">${i+1}</div><div><b>${e(p.name)}</b><div class="small muted">${p.played}/${d.rooms.length} gespielt · Ø ${Math.round(p.average)}%</div></div><div class="score">${fmt(p.total)}</div></div>`).join('')}</div></section>`;
}
function timelineChart(d){
  const people=d.people.slice(0,8),rooms=d.rooms,W=720,H=285,L=46,Rp=18,Top=18,B=64,max=Math.max(46,rooms.length*46),plotW=W-L-Rp,plotH=H-Top-B;
  const x=i=>rooms.length===1?L+plotW/2:L+i*plotW/(rooms.length-1),y=v=>Top+plotH-(v/max)*plotH;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kumulativer Punktestand über die Tastings">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);svg+=`<line x1="${L}" y1="${yy}" x2="${W-Rp}" y2="${yy}" class="gridline"/><text x="${L-7}" y="${yy+4}" text-anchor="end" class="axistext">${Math.round(v)}</text>`}
  people.forEach((p,pi)=>{const pts=p.timeline.map((t,i)=>`${x(i)},${y(t.cumulative)}`).join(' '),c=lineColors[pi%lineColors.length];if(rooms.length>1)svg+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;p.timeline.forEach((t,i)=>svg+=`<circle cx="${x(i)}" cy="${y(t.cumulative)}" r="5" fill="${c}" stroke="#fffdfa" stroke-width="2"/>`)});
  rooms.forEach((r,i)=>{const label=(r.theme||`Runde ${i+1}`).replace(/^(.{18}).+$/,'$1…');svg+=`<text x="${x(i)}" y="${H-28}" text-anchor="middle" class="xtext">${e(label)}</text>`});svg+='</svg>';
  const legend=people.map((p,i)=>`<span><i style="background:${lineColors[i%lineColors.length]}"></i>${e(p.name)}</span>`).join('');
  return`<div class="chartwrap">${svg}</div><div class="legend">${legend}</div>${d.people.length>8?`<p class="tiny muted">Im Diagramm werden die ersten 8 Plätze gezeigt; die Tabelle enthält alle.</p>`:''}`;
}
function fmt(n){const v=Number(n)||0;return Number.isInteger(v)?String(v):v.toFixed(1)}

async function hostPortal(){
  clearPoll();if(!H){A.innerHTML=brand()+`<section class="card"><h2>Host-Sitzung abgelaufen</h2><p class="muted">Öffne den ursprünglichen Host-Link erneut.</p></section>`;return}
  let h;try{h=await rpc('host_get_event_state',{p_event_code:E,p_host_token:H})}catch{A.innerHTML=brand()+`<section class="card"><h2>Host-Link ungültig</h2></section>`;return}
  const simpleRoom=(h.rooms||[]).find(x=>x.tasting_type==='red_simple')?.code||'REDSMP';const link=`${location.origin}${location.pathname}?event=${encodeURIComponent(E)}&room=${encodeURIComponent(simpleRoom)}&kiosk=0`,portal=`${location.origin}${location.pathname}?event=${encodeURIComponent(E)}&kiosk=0`,publicState=await rpc('get_event_state',{p_event_code:E}).catch(()=>null),history=publicState?await loadEventLeaderboard(publicState):[];
  A.innerHTML=brand(`<span class="room">Host</span>`)+`<section class="card hero"><div class="ey">Steuerung</div><h2>${e(h.title)}</h2><div class="hostlinks"><div class="field"><label>Mitspieler-Link · Rotwein einfach</label><input id="inv" readonly value="${e(link)}"></div><button id="copy" class="btn primary full">Mitspieler-Link kopieren</button><details><summary>Portal mit allen Runden</summary><div class="field"><input id="portalinv" readonly value="${e(portal)}"></div><button id="copyportal" class="btn secondary full">Portal-Link kopieren</button></details></div><a class="linkbtn hostexit" href="?event=${encodeURIComponent(E)}&kiosk=0">📱 Teilnehmeransicht öffnen</a></section><div class="pairlist">${h.rooms.map(hostCard).join('')}</div>${eventLeaderboard(history,'Aktueller Gesamtstand')}`;
  document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(link).then(()=>toast('Mitspieler-Link kopiert'));const cp=document.getElementById('copyportal');if(cp)cp.onclick=()=>navigator.clipboard.writeText(portal).then(()=>toast('Portal-Link kopiert'));
  document.querySelectorAll('[data-phase]').forEach(x=>x.onclick=async()=>{const phase=x.dataset.phase,room=x.dataset.room,msg=phase==='profiles'?'Profile für dieses Paar freigeben?':'Dieses Paar jetzt endgültig auflösen?';if(confirm(msg)){try{await rpcCompat('host_set_room_phase_v2','host_set_room_phase',{p_event_code:E,p_host_token:H,p_room_code:room,p_phase:phase});hostPortal()}catch(z){toast(z.message)}}});
  document.querySelectorAll('[data-reset]').forEach(x=>x.onclick=async()=>{if(confirm('Alle Teilnehmer und Antworten dieses Paars löschen und neu starten?')){await rpcCompat('host_reset_room_v2','host_reset_room',{p_event_code:E,p_host_token:H,p_room_code:x.dataset.reset});localStorage.removeItem(historyKey(x.dataset.reset));hostPortal()}});
  poll=setTimeout(hostPortal,7000);
}
function hostCard(r){const phase=r.phase==='tasting'?'freie Verkostung':r.phase==='profiles'?'Profile A/B':'aufgelöst';return`<section class="card pair"><div class="pairtop"><div><div class="ey">${r.tasting_type==='white'?'🥂':'🍷'} ${e(r.theme)}</div><h3>${phase}</h3></div><span class="pill">${r.tasting_done}/${r.participants} fertig</span></div><div class="stats"><div class="stat"><b>${r.participants}</b>Teilnehmer</div><div class="stat"><b>${r.tasting_done}</b>fertig</div><div class="stat"><b>${r.guesses_done}</b>zugeordnet</div></div>${r.phase==='tasting'?`<button class="btn primary full" data-phase="profiles" data-room="${e(r.code)}">Profile freigeben</button>`:r.phase==='profiles'?`<button class="btn primary full" data-phase="revealed" data-room="${e(r.code)}">Auflösung freigeben</button>`:`<div class="hint ok">Aufgelöst</div>`}<details><summary>Setup-Zuordnung anzeigen ⚠️</summary><div class="hint"><b>Wein 1:</b> ${e(r.glass1)}<br><b>Wein 2:</b> ${e(r.glass2)}</div></details><button class="linkbtn danger" data-reset="${e(r.code)}">Paar zurücksetzen</button></section>`}

document.addEventListener('click',async ev=>{const n=ev.target.closest('[data-nav]');if(!n)return;ev.preventDefault();await flushAll();location.href=n.dataset.nav});
window.addEventListener('pagehide',()=>{keepaliveSave(1);keepaliveSave(2)});
boot();
